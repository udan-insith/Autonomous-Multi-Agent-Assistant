<!--
  dashboard.component.html
  Dark slate tech aesthetic. Emerald = active/healthy agent work.
  Violet = data / stream activity. Rose = failure state only.
-->
<style>
  @keyframes glow-rotate {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes soft-pulse {
    0%,
    100% {
      opacity: 0.55;
      transform: scale(1);
    }
    50% {
      opacity: 1;
      transform: scale(1.05);
    }
  }
  .agent-glow-ring {
    background: conic-gradient(from 0deg, transparent, rgba(16, 185, 129, 0.55), transparent 30%);
    animation: glow-rotate 2.6s linear infinite;
  }
  .agent-pulse-dot {
    animation: soft-pulse 1.6s ease-in-out infinite;
  }
  .terminal-scroll::-webkit-scrollbar {
    width: 8px;
  }
  .terminal-scroll::-webkit-scrollbar-track {
    background: transparent;
  }
  .terminal-scroll::-webkit-scrollbar-thumb {
    background: rgba(139, 92, 246, 0.35);
    border-radius: 9999px;
  }
  @media (prefers-reduced-motion: reduce) {
    .agent-glow-ring,
    .agent-pulse-dot {
      animation: none !important;
    }
  }
</style>

<div
  class="min-h-screen w-full bg-slate-900 text-slate-200 font-sans antialiased section:bg-emerald-500/30"
  @panelEnter
>
  <ng-container *ngIf="project$ | async as project">
    <!-- HEADER -->
    <header
      class="panel-block sticky top-0 z-30 border-b border-white/5 bg-slate-900/80 backdrop-blur-md"
    >
      <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-4 px-6 py-4">
        <div class="flex items-center gap-3">
          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-500/10 ring-1 ring-emerald-500/30"
          >
            <svg lucideNetwork class="h-5 w-5 text-emerald-400"></svg>
          </div>
          <div>
            <h1 class="text-sm font-semibold tracking-wide text-slate-100">
              Autonomous Research Swarm
            </h1>
            <p class="text-xs text-slate-500">{{ project.topic }}</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <span
            class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium ring-1"
            [ngClass]="{
              'bg-emerald-500/10 text-emerald-400 ring-emerald-500/30':
                project.status === 'running',
              'bg-violet-500/10 text-violet-300 ring-violet-500/30': project.status === 'completed',
              'bg-rose-500/10 text-rose-400 ring-rose-500/30': project.status === 'failed',
            }"
          >
            <span class="h-1.5 w-1.5 rounded-full bg-current agent-pulse-dot"></span>
            {{
              project.status === 'running'
                ? 'Run in progress'
                : project.status === 'completed'
                  ? 'Run complete'
                  : 'Run failed'
            }}
          </span>

          <button
            type="button"
            (click)="restartRun()"
            class="inline-flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
          >
            <svg lucideRotateCcw class="h-3.5 w-3.5"></svg>
            Restart run
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto grid max-w-[1600px] grid-cols-1 gap-6 px-6 py-6 xl:grid-cols-12">
      <!-- STATUS PANEL -->
      <section class="panel-block xl:col-span-12">
        <h2
          class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-slate-500"
        >
          <svg lucideNetwork class="h-3.5 w-3.5"></svg>
          Agent Swarm
        </h2>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <article
            *ngFor="let agent of project.agents; trackBy: trackAgent"
            [@agentStateAnimation]="agent.status"
            class="relative overflow-hidden rounded-2xl border bg-slate-800/60 p-4 backdrop-blur-sm transition-colors"
            [ngClass]="{
              'border-white/5': agent.status === 'idle',
              'border-emerald-500/40': agent.status === 'working',
              'border-emerald-500/50 bg-emerald-500/[0.04]': agent.status === 'completed',
              'border-rose-500/50 bg-rose-500/[0.04]': agent.status === 'failed',
            }"
          ></article>
        </div>
      </section>
    </main>
  </ng-container>
</div>
